<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f0f0f0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        div.container{
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
        h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: bold;
        }
        p {
            color: #666;
            font-size: 18px;
        }
        span {
            font-size: 50px;
            margin-bottom: 20px;
        }
        #domain{
            font-size: 14px;
            color: #999;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <strong id="domain"></strong>
        <h1><span>🚧</span>Coming Soon</h1>
        <p>Our website is <b>Under Construction</b>.. Stay tuned for something amazing!</p>
    </div>
    <script>
        let domainElement = document.getElementById('domain');
        domainElement.textContent = window.location.hostname.split('.')[0];
    </script>
</body>
</html>
